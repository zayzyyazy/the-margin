# General-news sources for "The World, Explained". Live-tested 2026-10-21: feed answers, outlet identity matches the feed
# title, items carry publication dates, and the article pages are readable as full text (trafilatura, ≥ 250 words).
# Opinion and live pages are recognised per item (margin/world.py) and never used as evidence.
# Left out: POLITICO Europe (article pages reachable only as 150–240-word teasers), Reuters/AP (block scripts).
